# config/tools.conf
# Rutas y configuración centralizada. Actualmente el código en modules/
# tiene algunos valores hardcodeados (wordlist de gobuster/ffuf); este
# archivo queda como referencia para cuando se externalice esa config.

[wordlists]
dir_common = /usr/share/wordlists/dirb/common.txt
dir_medium = /usr/share/wordlists/seclists/Discovery/Web-Content/raft-medium-directories.txt
subdomains = /usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt

[nmap]
min_rate = 5000
udp_top_ports_normal = 100
udp_top_ports_deep = 1000

[web]
gobuster_threads = 50

[nvd]
# NVD sin API key tiene rate limit bajo (5 req/30s aprox).
# Si tienes una key propia (https://nvd.nist.gov/developers/request-an-api-key),
# el delay entre requests podría bajarse considerablemente.
delay_seconds = 6

[github]
delay_seconds = 2
